<!doctype html>
<html><head><meta charset="utf-8"><title>Sebastian Companion</title>
<style>
  body{width:320px;margin:0;font:13px/1.45 Poppins,system-ui,sans-serif;color:#1C1B19;background:#FCFBF9}
  header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #ECE8E2}
  header img{width:26px;height:26px} header b{font:500 18px "EB Garamond",Georgia,serif}
  main{padding:14px 16px} .muted{color:#6E6A64;font-size:12px}
  input,textarea{width:100%;box-sizing:border-box;border:1px solid #ECE8E2;border-radius:10px;padding:8px 10px;font:inherit;background:#fff}
  textarea{height:54px;resize:none;margin-top:6px}
  button{border:0;border-radius:999px;padding:9px 14px;font:inherit;cursor:pointer}
  .primary{background:#1C1B19;color:#fff;width:100%;margin-top:8px} .ghost{background:none;color:#6E6A64;padding:4px 8px}
  ul{list-style:none;padding:0;margin:8px 0 0;max-height:170px;overflow:auto} li{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #ECE8E2}
  li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  label{display:flex;gap:8px;align-items:flex-start;margin-top:14px} .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  a{color:#94662A}
</style></head>
<body>
  <header><img src="icons/icon-48.png" alt=""><b>Sebastian Companion</b></header>
  <main>
    <div class="muted" id="current">This page</div>
    <textarea id="note" placeholder="What's left to do? (optional)"></textarea>
    <button class="primary" id="save">Save this page as unfinished</button>
    <div class="row"><b>Waiting for Sebastian</b><span class="muted" id="count"></span></div>
    <ul id="list"></ul>
    <label><input type="checkbox" id="watch" style="width:auto;margin-top:2px"><span>Remind me about tabs I leave open<br><span class="muted">Lets the extension see your open tabs' titles and addresses. You can turn this off at any time.</span></span></label>
    <p class="muted" style="margin-top:14px">Items are handed to Sebastian the next time you open it in this browser. Nothing is sent anywhere else.</p>
  </main>
  <script src="popup.js"></script>
</body></html>
